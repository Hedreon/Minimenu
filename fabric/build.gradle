plugins {
    id("com.gradleup.shadow")
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom(common)
    runtimeClasspath.extendsFrom(common)

    developmentFabric.extendsFrom(common)

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "TerraformersMC"
        url = uri("https://maven.terraformersmc.com/releases/")
    }
    maven {
        name = "isXander"
        url = uri("https://maven.isxander.dev/releases/")
    }
}

dependencies {
    implementation("net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}")

    implementation("dev.isxander:yet-another-config-lib:${rootProject.yacl_version}+${project.minecraft_version}-fabric")
    implementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    common(project("path": ":common")) {
        transitive = false
    }

    shadowBundle(project("path": ":common", "configuration": "transformProductionFabric"))
}

processResources {
    def version = project.version

    inputs.property("version", version)

    filesMatching("fabric.mod.json") {
        expand(
                "version": version,
                "minecraft_version": project.minecraft_version,
                "loader_version": rootProject.fabric_loader_version,
                "api_version": rootProject.fabric_api_version,
                "yacl_version": "${rootProject.yacl_version}+${project.minecraft_version}-fabric"
        )
    }
}

// The shaded .jar file is the mod .jar file that will ship.
jar {
    archiveClassifier = "dev"
}

shadowJar {
    // noinspection GroovyAccessibility, GroovyAssignabilityCheck
    configurations = project.configurations.shadowBundle

    archiveClassifier = null
}

assemble.dependsOn(shadowJar)

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}