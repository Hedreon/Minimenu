modLoader = "javafml"
loaderVersion = "[10,)"
license = "MIT"
issueTrackerURL = "https://github.com/Hedreon/Minimenu/issues"

[[mods]]
modId = "minimenu"
version = "${version}"
displayName = "Minimenu"
description = "Declutters screens like the title screen through configurable options."
iconFile = "icon-neoforge.png"
credits = "jackassmc, umollu, huiki, TGODiamond"
authors = "TomB_134, Hedreon"
displayURL = "https://github.com/Hedreon/Minimenu"

[[mixins]]
config = "minimenu.mixins.json"

[features.minimenu]
javaVersion = "[25,)"

[[dependencies.minimenu]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}.0,26.3.0)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.minimenu]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.minimenu]]
modId = "yet_another_config_lib_v3"
type = "required"
versionRange = "[${yacl_version},)"
ordering = "NONE"
side = "CLIENT"