plugins {
    id("com.gradleup.shadow")
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom(common)
    runtimeClasspath.extendsFrom(common)

    developmentNeoForge.extendsFrom(common)

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = uri("https://maven.neoforged.net/releases/")
    }
    maven {
        name = "isXander"
        url = uri("https://maven.isxander.dev/releases/")
    }
}

dependencies {
    neoForge("net.neoforged:neoforge:${project.neoforge_version}")

    implementation("dev.isxander:yet-another-config-lib:${rootProject.yacl_version}+${project.minecraft_version}-neoforge")

    common(project("path": ":common")) {
        transitive = false
    }

    shadowBundle(project("path": ":common", "configuration": "transformProductionNeoForge"))
}

processResources {
    def version = project.version

    inputs.property("version", version)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
                "version": version,
                "minecraft_version": project.minecraft_version,
                "neoforge_version": project.neoforge_version,
                "yacl_version": "${rootProject.yacl_version}+${project.minecraft_version}-neoforge"
        )
    }
}

// The shaded .jar file is the mod .jar file that will ship.
jar {
    archiveClassifier = "dev"
}

shadowJar {
    // noinspection GroovyAccessibility, GroovyAssignabilityCheck
    configurations = project.configurations.shadowBundle

    archiveClassifier = null
}

assemble.dependsOn(shadowJar)

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}