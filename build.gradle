plugins {
    id("com.gradleup.shadow").version("${shadow_version}").apply(false)
    id("dev.architectury.loom-no-remap").version("${loom_version}").apply(false)
    id("architectury-plugin").version("${architectury_version}")
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    plugins.apply("dev.architectury.loom-no-remap")
    plugins.apply("architectury-plugin")
    plugins.apply("maven-publish")

    base {
        // Set up a prefixed format for the mods .jar file names, e.g. "minimenu_fabric".
        archivesName = "${rootProject.archive_name}_${project.name}"
    }

    repositories {
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    dependencies {
        // To change the versions below, see the gradle.properties file.
        minecraft("com.mojang:minecraft:${project.minecraft_version}")
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar
        // task and to the "build" task if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    jar {
        def projectName = project.name

        inputs.property("projectName", projectName)

        from("LICENSE") {
            rename {
                fileName -> "${fileName}_${projectName}"
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 25
    }

    publishing {
        // See https://docs.gradle.org/current/userguide/publishing_maven.html
        // for information on how to set up publishing.
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()

                // noinspection GroovyAssignabilityCheck
                from components.java
            }
        }

        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}